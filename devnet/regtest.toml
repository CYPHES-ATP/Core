# CYPHES devnet: regtest, local only, internal BeamHash III miner.
#
#   cargo build -p zebrad --features internal-miner
#   ./target/debug/zebrad -c devnet/regtest.toml start
#
# The reference CPU solver uses every core and about 8 GiB of RAM.

[mining]
internal_miner = true
# Ironwood-only address from the PUBLIC devnet seed
# (`cargo run -p zebra-chain --example cyphes_address -- regtest`).
# Never send real value to it. Rewards become Ironwood coinbase outputs.
miner_address = "cyphregtest1gymj99nyn4c9n68u3vcuqlr57p8evnukeqfnt5l3tvnq0na2amv6tz270dwfnzrg8x63yhvskqgalaewgnqy6zts0842s3w2esyrtye0"

[network]
network = "Regtest"
listen_addr = "127.0.0.1:22974"
initial_mainnet_peers = []
initial_testnet_peers = []
cache_dir = false

[rpc]
listen_addr = "127.0.0.1:22975"
# Light-wallet gRPC (lightwalletd CompactTxStreamer) for cyphes-wallet.
lightwalletd_listen_addr = "127.0.0.1:22976"
enable_cookie_auth = false

[state]
ephemeral = true

[tracing]
use_color = false
